<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Libros TTS</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A90E2">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f4f6f9; color: #333; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; border-radius: 12px; padding: 18px; width: 100%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .file-input-wrapper { display: flex; flex-direction: column; gap: 8px; align-items: center; border: 2px dashed #cbd5e1; padding: 20px; border-radius: 8px; background: #f8fafc; }
        input[type="file"] { display: none; }
        .btn-select { background: #4A90E2; color: white; padding: 10px 18px; border-radius: 6px; font-weight: bold; }
        .controls { display: flex; gap: 10px; margin-top: 15px; }
        button.ctrl-btn { background: #2ecc71; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; flex: 1; }
        button.ctrl-btn:disabled { background: #bdc3c7; }
        button.ctrl-btn.stop { background: #e74c3c; }
        button.ctrl-btn.pause { background: #f39c12; }
        .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        select, input[type="range"] { padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; width: 100%; }
        #text-container { white-space: pre-wrap; max-height: 250px; overflow-y: auto; padding: 12px; background: #fafafa; border: 1px solid #e2e8f0; border-radius: 8px; margin-top: 15px; word-break: break-word; }
        .status { text-align: center; font-size: 0.85rem; color: #64748b; margin-top: 10px; }
    </style>
</head>
<body>
    <header style="text-align:center; margin-bottom:15px;">
        <h1>📖 Lector de Libros TTS</h1>
        <p style="font-size:0.85rem; color:#7f8c8d;">TXT, PDF y EPUB</p>
    </header>
    <main class="card">
        <label for="file-input" class="file-input-wrapper">
            <span id="file-label">📁 Selecciona tu libro</span>
            <span class="btn-select">Buscar Archivo</span>
            <input type="file" id="file-input" accept=".txt,.pdf,.epub">
        </label>
        <div class="settings">
            <label>Voz: <select id="voice-select"></select></label>
            <label>Velocidad (<span id="rate-val">1.0</span>x): <input type="range" id="rate-slider" min="0.5" max="2" step="0.1" value="1.0"></label>
        </div>
        <div class="controls">
            <button id="btn-play" class="ctrl-btn" disabled>▶️ Leer</button>
            <button id="btn-pause" class="ctrl-btn pause" disabled>⏸️ Pausa</button>
            <button id="btn-stop" class="ctrl-btn stop" disabled>⏹️ Detener</button>
        </div>
        <div id="status-text" class="status">Selecciona un archivo para empezar</div>
        <div id="text-container">El texto de tu libro aparecerá aquí...</div>
    </main>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const fileInput = document.getElementById('file-input');
        const textContainer = document.getElementById('text-container');
        const voiceSelect = document.getElementById('voice-select');
        const rateSlider = document.getElementById('rate-slider');
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const btnStop = document.getElementById('btn-stop');
        const statusText = document.getElementById('status-text');
        let synth = window.speechSynthesis, voices = [], loadedText = "";

        function loadVoices() {
            voices = synth.getVoices().filter(v => v.lang.startsWith('es') || v.lang.startsWith('en'));
            voiceSelect.innerHTML = '';
            if (voices.length === 0) voices = synth.getVoices();
            voices.forEach((voice, index) => {
                const opt = document.createElement('option');
                opt.value = index; opt.textContent = `${voice.name} (${voice.lang})`;
                if (voice.lang.startsWith('es')) opt.selected = true;
                voiceSelect.appendChild(opt);
            });
        }
        if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            statusText.textContent = "Procesando...";
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext === 'txt') {
                const reader = new FileReader();
                reader.onload = (evt) => { loadedText = evt.target.result; textContainer.textContent = loadedText; btnPlay.disabled = false; statusText.textContent = "¡Listo!"; };
                reader.readAsText(file);
            } else if (ext === 'pdf') {
                const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    fullText += content.items.map(item => item.str).join(' ') + '\n\n';
                }
                loadedText = fullText; textContainer.textContent = loadedText; btnPlay.disabled = false; statusText.textContent = "¡PDF listo!";
            } else if (ext === 'epub') {
                const book = ePub(await file.arrayBuffer());
                await book.ready;
                let fullText = "";
                for (const item of book.spine.spineItems) {
                    const doc = await item.load(book.load.bind(book));
                    fullText += doc.textContent + "\n\n";
                }
                loadedText = fullText; textContainer.textContent = loadedText; btnPlay.disabled = false; statusText.textContent = "¡EPUB listo!";
            }
        });

        btnPlay.addEventListener('click', () => {
            if (!loadedText) return;
            if (synth.paused) { synth.resume(); statusText.textContent = "Leyendo..."; return; }
            synth.cancel();
            const utt = new SpeechSynthesisUtterance(loadedText);
            if (voices[voiceSelect.value]) utt.voice = voices[voiceSelect.value];
            utt.rate = parseFloat(rateSlider.value);
            utt.onstart = () => { statusText.textContent = "Leyendo en voz alta..."; btnPlay.disabled = true; btnPause.disabled = false; btnStop.disabled = false; };
            utt.onend = () => { statusText.textContent = "Finalizado"; btnPlay.disabled = false; btnPause.disabled = true; btnStop.disabled = true; };
            synth.speak(utt);
        });

        btnPause.addEventListener('click', () => { if (synth.speaking && !synth.paused) { synth.pause(); statusText.textContent = "En pausa"; btnPlay.disabled = false; btnPause.disabled = true; } });
        btnStop.addEventListener('click', () => { synth.cancel(); statusText.textContent = "Detenido"; btnPlay.disabled = false; btnPause.disabled = true; btnStop.disabled = true; });
    </script>
</body>
</html>
